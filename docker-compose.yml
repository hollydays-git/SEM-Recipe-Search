version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: backend
    env_file:
      - ./.env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      EMBEDDING_SERVICE_URL: http://embedding_service:8100
      VITE_API_BASE_URL: http://backend:8000
    depends_on:
      - qdrant
      - embedding_service
    ports:
      - "8000:8000"
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      VITE_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app-network

  embedding_service:
    build:
      context: ./embedding_service
      dockerfile: Dockerfile
    container_name: embedding_service
    ports:
      - "8100:8100"
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  qdrant-data:
