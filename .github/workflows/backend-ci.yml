name: Backend CI

on:
  push: {}
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          else
            # ensure common test/lint tools are available if no dev requirements provided
            pip install pytest flake8 || true
          fi

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check .

      - name: Run tests
        run: |
          # Run pytest if tests directory or pytest config exists, otherwise run unittest discovery.
          if [ -f "pytest.ini" ] || [ -d "tests" ] || grep -q "\[tool.pytest.ini_options\]" pyproject.toml 2>/dev/null; then
            pytest -q
          elif ls *_test.py 1> /dev/null 2>&1 || ls test_*.py 1> /dev/null 2>&1; then
            python -m unittest discover -v
          else
            echo "No tests found - failing CI to enforce adding tests."
            exit 1
          fi